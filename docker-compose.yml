services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lightback:${POSTGRES_PASSWORD}@db:5432/lightback?connection_limit=20
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3300:3300"
    depends_on:
      - db
      - gotenberg
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lightback
      POSTGRES_DB: lightback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5440:5432"
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]
    ports:
      - "127.0.0.1:3310:3000"
volumes:
  pgdata:
